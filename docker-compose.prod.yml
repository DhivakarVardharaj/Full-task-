services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - smart-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: smart-task/auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/authdb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-network

  task-service:
    image: smart-task/task-service:latest
    container_name: task-service
    restart: unless-stopped
    environment:
      PORT: 5002
      MONGO_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-network

  notification-service:
    image: smart-task/notification-service:latest
    container_name: notification-service
    restart: unless-stopped
    environment:
      PORT: 5003
      MONGO_URI: mongodb://mongodb:27017/notificationdb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-network

  report-service:
    image: smart-task/report-service:latest
    container_name: report-service
    restart: unless-stopped
    environment:
      PORT: 5004
      MONGO_URI: mongodb://mongodb:27017/reportdb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-network

  api-gateway:
    image: smart-task/api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      TASK_SERVICE_URL: http://task-service:5002
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
    depends_on:
      - auth-service
      - task-service
    networks:
      - smart-network

volumes:
  mongo_data:

networks:
  smart-network:
    driver: bridge
